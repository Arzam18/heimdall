name: Build Heimdall for Android (ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install Nimble Dependencies
        run: |
          nimble install -y -d

      - name: Patch Android SELinux sysfs restrictions
        run: |
          # Prevent unhandled IOError when Android SELinux blocks access to /sys/devices/system/node/online
          find src/ -type f -name "*.nim" -exec sed -i 's|readFile("/sys/devices/system/node/online")|(if fileExists("/sys/devices/system/node/online"): readFile("/sys/devices/system/node/online") else: "")|g' {} +

      - name: Build Heimdall (Android ARM64 / NEON)
        run: |
          NDK_BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          NDK_CLANG=$NDK_BIN/aarch64-linux-android28-clang
          NDK_LD=$NDK_BIN/ld.lld

          make neon \
            CC=clang \
            LD="$NDK_LD" \
            HOST_ARCH=arm64 \
            NATIVE_ARCH_FLAGS="" \
            CFLAGS="-flto" \
            OS_TAG=android \
            EXE_BASE=bin/heimdall-android-arm64 \
            EXTRA_NFLAGS="--cpu:arm64 --os:android --clang.exe='$NDK_CLANG' --clang.linkerexe='$NDK_CLANG'"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-android-arm64
          path: bin/heimdall-android-arm64
